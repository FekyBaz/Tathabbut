name: Feature request
description: Propose a feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this send data outside the browser?
      options:
        - No
        - Yes, with explicit opt-in
        - Not sure yet
    validations:
      required: true
