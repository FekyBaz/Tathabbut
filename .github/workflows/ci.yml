name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    name: Extension tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify unpacked extension files
        run: |
          test -f dist/manifest.json
          test -f dist/content.js
          test -f dist/background.js
          test -f dist/content.css
          test -f dist/popup.html
          test -f dist/popup.js
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3 || m.background?.service_worker!=='background.js' || !m.optional_host_permissions?.includes('https://*/*')) process.exit(1);"
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: tathabbut-chrome-extension
          path: extension/dist/
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
