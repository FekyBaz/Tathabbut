<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tathabbut settings</title>
    <style>
      body { width: 320px; margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 2px; font-size: 18px; }
      .muted { color: #5b6470; margin: 0 0 16px; }
      label { display: block; margin: 10px 0; }
      input[type="url"] { box-sizing: border-box; width: 100%; padding: 8px; }
      input[type="range"] { width: 100%; }
      select { padding: 8px; }
      button { padding: 8px 12px; cursor: pointer; }
      .row { display: flex; align-items: center; gap: 8px; }
      #status { min-height: 1.4em; }
      .diag { margin: 8px 0; }
      .diag > div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
      .diag dt { color: #5b6470; }
      .diag dd { margin: 0; text-align: end; }
      fieldset { border: 1px solid #c6cbd1; border-radius: 8px; margin: 12px 0; }
    </style>
  </head>
  <body>
    <h1>Tathabbut <span lang="ar">تثبّت</span></h1>
    <p class="muted" id="appSubtitle"></p>
    <label class="row"><input id="enabled" type="checkbox" /> <span id="enabledLabel"></span></label>
    <fieldset>
      <legend id="categoriesLegend"></legend>
      <label><input type="checkbox" name="category" value="harassment" /> <span id="cat-harassment"></span></label>
      <label><input type="checkbox" name="category" value="hate" /> <span id="cat-hate"></span></label>
      <label><input type="checkbox" name="category" value="threats" /> <span id="cat-threats"></span></label>
      <label><input type="checkbox" name="category" value="spam" /> <span id="cat-spam"></span></label>
    </fieldset>
    <label for="threshold"><span id="thresholdLabel"></span> <strong id="thresholdValue">85%</strong></label>
    <input id="threshold" type="range" min="50" max="99" value="85" />
    <label for="apiUrl" id="apiLabel"></label>
    <input id="apiUrl" type="url" placeholder="http://127.0.0.1:8000" autocomplete="off" />
    <p class="muted" id="apiHint"></p>
    <label for="language" id="languageLabel"></label>
    <select id="language">
      <option value="ar" id="lang-ar"></option>
      <option value="en" id="lang-en"></option>
    </select>
    <p><button id="save" type="button"></button></p>
    <p id="status" role="status" aria-live="polite"></p>
    <fieldset>
      <legend id="diagnosticsLegend"></legend>
      <label class="row"><input id="debug" type="checkbox" /> <span id="diagnosticsToggle"></span></label>
      <p class="muted" id="diagnosticsHint"></p>
      <dl class="diag">
        <div><dt id="dt-started"></dt><dd id="st-started">—</dd></div>
        <div><dt id="dt-settings"></dt><dd id="st-settings">—</dd></div>
        <div><dt id="dt-articles"></dt><dd id="st-articles">—</dd></div>
        <div><dt id="dt-counts"></dt><dd id="st-counts">—</dd></div>
        <div><dt id="dt-reason"></dt><dd id="st-reason">—</dd></div>
        <div><dt id="dt-skips"></dt><dd id="st-skips">—</dd></div>
        <div><dt id="dt-updated"></dt><dd id="st-updated">—</dd></div>
        <div><dt id="dt-source"></dt><dd id="st-source">—</dd></div>
      </dl>
      <p class="muted" id="tabNote"></p>
      <button id="refreshStatus" type="button"></button>
    </fieldset>
    <script type="module" src="popup.js"></script>
  </body>
</html>
